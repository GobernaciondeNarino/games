<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ñaño 3D</title>
    <!-- favicon embebido (punto turquesa) para que el navegador no haga 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231a9b8a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">
      <div><b>WASD</b> moverse · <b>Shift</b> correr · <b>Espacio</b> saltar</div>
      <div><b>Mouse arrastrar</b> orbitar cámara · <b>Rueda</b> zoom</div>
      <div>Recoge gemas brillantes · juega fútbol · explora la zona tech</div>
    </div>
    <div id="scorebox">
      <div class="lbl">Puntos</div>
      <div class="big"><span id="score">0</span></div>
      <div class="lbl">Goles: <span id="goals">0</span></div>
      <div class="lbl">Gemas restantes: <span id="gems">0</span></div>
    </div>
    <div id="loading">Cargando a Ñaño…</div>

    <!--
      ===========================================================================
      Ñaño 3D — estructura del proyecto:
        index.html              · este documento (sólo la cáscara HTML)
        css/style.css           · estilos de la interfaz (HUD, marcador, carga)
        js/main.js              · todo el código del juego (módulo ES)
        vendor/three.module.js  · la librería Three.js (no cambia nunca)
      Para desplegar en Plesk: sube las carpetas css/, js/ y vendor/ junto a
      este index.html. Deben subirse TODAS para que el juego funcione.
      ===========================================================================
    -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
