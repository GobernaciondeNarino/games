<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ñaño 3D</title>
    <!-- inline favicon (teal dot) so the browser doesn't 404 on /favicon.ico -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231a9b8a'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #88c7ff; font-family: system-ui, sans-serif; color: #fff; }
      #app { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; left: 12px; top: 12px; padding: 10px 14px;
        background: rgba(0,0,0,0.45); border-radius: 8px; font-size: 13px; line-height: 1.4;
        pointer-events: none; user-select: none;
      }
      #hud b { color: #6fffd3; }
      #scorebox {
        position: fixed; right: 12px; top: 12px; padding: 10px 16px;
        background: rgba(0,0,0,0.5); border-radius: 8px; font-size: 15px;
        line-height: 1.5; pointer-events: none; user-select: none; text-align: right;
      }
      #scorebox .big { font-size: 26px; font-weight: bold; color: #ffe066; }
      #scorebox .lbl { color: #9fe7ff; }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #88c7ff; font-size: 22px; letter-spacing: 0.04em;
      }
      #loading.hidden { display: none; }
      #loading.error { background: #b44; font-size: 16px; padding: 0 24px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">
      <div><b>WASD</b> moverse · <b>Shift</b> correr · <b>Espacio</b> saltar</div>
      <div><b>Mouse arrastrar</b> orbitar cámara · <b>Rueda</b> zoom</div>
      <div>Recoge gemas brillantes · juega fútbol · explora la zona tech</div>
    </div>
    <div id="scorebox">
      <div class="lbl">Puntos</div>
      <div class="big"><span id="score">0</span></div>
      <div class="lbl">Gemas restantes: <span id="gems">0</span></div>
    </div>
    <div id="loading">Cargando a Ñaño…</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
